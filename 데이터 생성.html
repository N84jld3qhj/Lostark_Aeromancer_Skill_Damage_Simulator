<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로스트아크 데이터 통합 생성기</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { padding: 20px; background: #f8f9fa; color: #333; max-width: 1300px; margin: 0 auto; }
        
        /* 탭 스타일 */
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #dee2e6; }
        .tab-btn { padding: 12px 24px; font-size: 16px; font-weight: bold; border: none; background: #e9ecef; color: #495057; cursor: pointer; border-radius: 8px 8px 0 0; transition: all 0.2s; }
        .tab-btn.active { background: #007bff; color: white; }
        .tab-btn.order-tab.active { background: #fd7e14; color: white; }
        .tab-btn.buff-tab.active { background: #6f42c1; color: white; }
        .tab-btn.spec-tab.active { background: #20c997; color: white; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Layout */
        .container { display: flex; gap: 20px; }
        .form-section { flex: 1.3; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .json-section { flex: 1; background: #1e1e1e; color: #d4d4d4; padding: 20px; border-radius: 8px; display: flex; flex-direction: column; gap: 10px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        
        /* 카드 및 서브 박스 */
        .card-box { background: #f8f9fa; padding: 12px; border-radius: 6px; margin-bottom: 12px; border: 1px solid #ced4da; }
        .skill-card { border-left: 5px solid #007bff; }
        .order-card { border-left: 5px solid #fd7e14; }
        .buff-card { border-left: 5px solid #6f42c1; }
        .spec-card { border-left: 5px solid #20c997; }
        
        .sub-effect-row { display: flex; gap: 6px; align-items: center; margin-top: 6px; background: #fff; padding: 6px; border-radius: 4px; border: 1px solid #e9ecef; }
        
        /* 버튼 공통 */
        .btn-del { background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; padding: 6px 10px; font-size: 12px; }
        .btn-add { background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; padding: 6px 10px; font-size: 12px; }
        .btn-sub-add { background: #17a2b8; color: white; border: none; border-radius: 4px; cursor: pointer; padding: 4px 8px; font-size: 12px; margin-top: 6px; }
        .btn-edit { background: #ffc107; color: #212529; border: none; border-radius: 4px; cursor: pointer; padding: 4px 8px; font-size: 12px; font-weight: bold; }

        .btn-submit { color: white; border: none; border-radius: 4px; cursor: pointer; padding: 12px; font-size: 16px; font-weight: bold; width: 100%; margin-top: 15px; }
        .btn-submit-skill { background: #007bff; }
        .btn-submit-skill:hover { background: #0056b3; }
        .btn-submit-order { background: #fd7e14; }
        .btn-submit-order:hover { background: #e8590c; }
        .btn-submit-buff { background: #6f42c1; }
        .btn-submit-buff:hover { background: #59359a; }
        .btn-submit-spec { background: #20c997; }
        .btn-submit-spec:hover { background: #19a179; }

        .btn-cancel { background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer; padding: 12px; font-size: 14px; font-weight: bold; margin-top: 8px; width: 100%; display: none; }

        /* 제어 버튼 그룹 */
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn-action { padding: 8px 12px; border: none; border-radius: 4px; color: white; font-weight: bold; cursor: pointer; font-size: 13px; text-align: center; }
        .btn-copy { background: #6c757d; }
        .btn-copy:hover { background: #495057; }
        .btn-file { background: #17a2b8; }
        .btn-file:hover { background: #117a8b; }
        .btn-reset { background: #dc3545; grid-column: span 2; }

        /* 등록된 리스트 현황 노출 영역 */
        .list-preview { background: #252526; border: 1px solid #333; padding: 10px; border-radius: 4px; max-height: 220px; overflow-y: auto; }
        .list-item { display: flex; justify-content: space-between; align-items: center; background: #333; padding: 6px 10px; border-radius: 4px; margin-bottom: 5px; font-size: 13px; color: #fff; }

        /* JSON 미리보기 */
        textarea { flex: 1; min-height: 300px; width: 100%; background: #1e1e1e; border: 1px solid #333; border-radius: 4px; font-family: monospace; resize: vertical; font-size: 13px; outline: none; padding: 10px; }
        .json-skill { color: #9cdcfe; }
        .json-order { color: #ce9178; }
        .json-buff { color: #b5cea8; }
        .json-spec { color: #4ec9b0; }
    </style>
</head>
<body>

<!-- 탭 메뉴 Header -->
<div class="tab-menu">
    <button class="tab-btn active" onclick="switchTab('skillTab', this)">⚡ 스킬 데이터 생성기</button>
    <button class="tab-btn order-tab" onclick="switchTab('orderTab', this)">☀️🌙⭐ 질서 코어 생성기</button>
    <button class="tab-btn buff-tab" onclick="switchTab('buffTab', this)">🛡️ 고유 버프 / 스탯 생성기</button>
    <button class="tab-btn spec-tab" onclick="switchTab('specTab', this)">🎨 직업 특화 설정</button>
</div>

<!-- TAB 1: 스킬 데이터 생성기 -->
<div id="skillTab" class="tab-content active">
    <div class="container">
        <div class="form-section">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3>⚡ 스킬 정보 입력</h3>
                <button type="button" class="btn-sub-add" onclick="loadSkillPreset()" style="background: #6f42c1;">⚡ 기본 딜러 프리셋 채우기</button>
            </div>
            <form id="skillForm">
                <div class="form-group">
                    <label>스킬명</label>
                    <input type="text" id="skillName" placeholder="예: 몰아치기" oninput="syncSkillNameToTag()">
                </div>

                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label>상수 (Constant)</label>
                        <input type="number" step="any" id="constant" placeholder="5550.0">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>계수 (Coefficient)</label>
                        <input type="number" step="any" id="coefficient" placeholder="29.47">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>기본 쿨타임 (초)</label>
                        <input type="number" step="any" id="baseCooldown" placeholder="18">
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>기본 마나 소모량</label>
                        <input type="number" step="any" id="baseMana" placeholder="480 (미입력 시 0)">
                    </div>
                </div>

                <div class="form-group">
                    <label>태그 (쉼표로 구분)</label>
                    <input type="text" id="tags" placeholder="몰아치기, 마나, 우산, 타대" 
                           onfocus="setActiveInput(this)" 
                           onkeyup="handleTagKeyUp(event, this)" 
                           onblur="registerTagsFromInput(this.value)">
                    <small style="color: #6c6c6c;">※ 스킬 입력 시 첫 번째 태그에 스킬명이 자동 추가됩니다.</small>

                    <!-- 📌 태그 추천 뱃지 영역 -->
                    <div style="margin-top: 8px;">
                        <span style="font-size: 11px; font-weight: bold; color: #495057;">📌 최근 사용된 태그 (클릭하여 추가):</span>
                        <div class="dynamic-tag-badges" style="display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px;"></div>
                    </div>
                </div>

                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <label style="margin: 0;">트라이포드 목록</label>
                        <button type="button" class="btn-add" onclick="addTripodCard()">+ 트라이포드 카드 추가</button>
                    </div>
                    <div id="tripodContainer"></div>
                </div>

                <button type="button" id="btnSkillSubmit" class="btn-submit btn-submit-skill" onclick="addSkillToDatabase()">+ 스킬 목록에 추가</button>
                <button type="button" id="btnSkillCancel" class="btn-cancel" onclick="cancelSkillEdit()">❌ 수정 취소</button>
            </form>
        </div>

        <div class="json-section">
            <label style="color: #fff;">📋 등록된 스킬 데이터 목록</label>
            <div id="skillListPreview" class="list-preview"></div>

            <label style="color: #fff;">📁 skillDatabase JSON 결과물</label>
            <textarea id="jsonSkillOutput" class="json-skill" onchange="syncJsonToData('skill')"></textarea>
            
            <div class="action-grid">
                <button class="btn-action btn-copy" onclick="copyJson('jsonSkillOutput')">📋 JSON 복사</button>
                <button class="btn-action btn-file" onclick="downloadJson(skillDatabase, 'skillDatabase.json')">💾 파일 저장</button>
                <button class="btn-action btn-file" onclick="document.getElementById('fileInputSkill').click()">📂 파일 불러오기</button>
                <button class="btn-action btn-copy" onclick="syncJsonToData('skill')">🔄 JSON -> 데이터 동기화</button>
                <button class="btn-action btn-reset" onclick="resetData('skill')">🗑️ 스킬 데이터 전체 초기화</button>
            </div>
            <input type="file" id="fileInputSkill" style="display:none;" accept=".json" onchange="uploadJson(event, 'skill')">
        </div>
    </div>
</div>

<!-- TAB 2: 질서 코어 데이터 생성기 -->
<div id="orderTab" class="tab-content">
    <div class="container">
        <div class="form-section">
            <h3>☀️🌙⭐ 질서 코어(아크그리드) 입력</h3>
            <form id="orderForm">
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label>코어 종류</label>
                        <select id="coreType">
                            <option value="해">☀️ 해</option>
                            <option value="달">🌙 달</option>
                            <option value="별">⭐ 별</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>그룹 아이디 (Group ID - 선택)</label>
                        <input type="text" id="groupId" placeholder="예: group_1 (선택사항)">
                    </div>
                    <div class="form-group" style="flex: 1.5;">
                        <label>노드 포인트</label>
                        <select id="nodePoint" onchange="toggle17ptUI(this.value)">
                            <option value="10">10 Point (고대+유물 동시 생성)</option>
                            <option value="14">14 Point (고대+유물 동시 생성)</option>
                            <option value="17">17 Point (고대 / 유물 옵션 분리 입력)</option>
                            <option value="18-20">18 ~ 20 Point (고대+유물 3개 자동 생성)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <label style="margin: 0;">노드 세부 효과 (복합 효과 입력 가능)</label>
                        <button type="button" class="btn-add" onclick="addOrderEffectRow()">+ 세부 효과 추가</button>
                    </div>
                    <div id="orderEffectsContainer"></div>
                </div>

                <button type="button" id="btnOrderSubmit" class="btn-submit btn-submit-order" onclick="addOrderNode()">+ 질서 코어 노드 추가</button>
                <button type="button" id="btnOrderCancel" class="btn-cancel" onclick="cancelOrderEdit()">❌ 수정 취소</button>
            </form>
        </div>

        <div class="json-section">
            <label style="color: #fff;">📋 등록된 질서 코어 데이터 목록</label>
            <div id="orderListPreview" class="list-preview"></div>

            <label style="color: #fff;">📁 orderDataSets JSON 결과물</label>
            <textarea id="jsonOrderOutput" class="json-order" onchange="syncJsonToData('order')"></textarea>
            
            <div class="action-grid">
                <button class="btn-action btn-copy" onclick="copyJson('jsonOrderOutput')">📋 JSON 복사</button>
                <button class="btn-action btn-file" onclick="downloadJson(orderDataSets, 'orderDataSets.json')">💾 파일 저장</button>
                <button class="btn-action btn-file" onclick="document.getElementById('fileInputOrder').click()">📂 파일 불러오기</button>
                <button class="btn-action btn-copy" onclick="syncJsonToData('order')">🔄 JSON -> 데이터 동기화</button>
                <button class="btn-action btn-reset" onclick="resetData('order')">🗑️ 코어 데이터 전체 초기화</button>
            </div>
            <input type="file" id="fileInputOrder" style="display:none;" accept=".json" onchange="uploadJson(event, 'order')">
        </div>
    </div>
</div>

<!-- TAB 3: 고유 버프 / 스탯 생성기 -->
<div id="buffTab" class="tab-content">
    <div class="container">
        <div class="form-section">
            <h3>🛡️ 고유 버프 / 스탯 입력</h3>
            <form id="buffForm">
                <div class="form-group">
                    <label>버프 / 스탯명</label>
                    <input type="text" id="buffName" placeholder="예: 여우비, 4스택 트라이포드, 자치적">
                </div>

                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <label style="margin: 0;">세부 효과</label>
                        <button type="button" class="btn-add" onclick="addBuffEffectRow()">+ 효과 추가</button>
                    </div>
                    <div id="buffEffectsContainer"></div>
                </div>

                <button type="button" id="btnBuffSubmit" class="btn-submit btn-submit-buff" onclick="addBuffToDatabase()">+ 버프 / 스탯 목록에 추가</button>
                <button type="button" id="btnBuffCancel" class="btn-cancel" onclick="cancelBuffEdit()">❌ 수정 취소</button>
            </form>
        </div>

        <div class="json-section">
            <label style="color: #fff;">📋 등록된 버프 / 스탯 목록</label>
            <div id="buffListPreview" class="list-preview"></div>

            <label style="color: #fff;">📁 buffDatabase JSON 결과물</label>
            <textarea id="jsonBuffOutput" class="json-buff" onchange="syncJsonToData('buff')"></textarea>
            
            <div class="action-grid">
                <button class="btn-action btn-copy" onclick="copyJson('jsonBuffOutput')">📋 JSON 복사</button>
                <button class="btn-action btn-file" onclick="downloadJson(buffDatabase, 'buffDatabase.json')">💾 파일 저장</button>
                <button class="btn-action btn-file" onclick="document.getElementById('fileInputBuff').click()">📂 파일 불러오기</button>
                <button class="btn-action btn-copy" onclick="syncJsonToData('buff')">🔄 JSON -> 데이터 동기화</button>
                <button class="btn-action btn-reset" onclick="resetData('buff')">🗑️ 버프 데이터 전체 초기화</button>
            </div>
            <input type="file" id="fileInputBuff" style="display:none;" accept=".json" onchange="uploadJson(event, 'buff')">
        </div>
    </div>
</div>

<!-- TAB 4: 직업 특화 설정 -->
<div id="specTab" class="tab-content">
    <div class="container">
        <div class="form-section">
            <h3>🎨 직업 특화 계수 설정</h3>
            <form id="specForm">
                <div class="form-group">
                    <label>특화 계수 (Specialization Coefficient)</label>
                    <input type="number" step="any" id="specCoefficient" placeholder="예: 0.00085">
                    <small style="color: #6c6c6c;">※ 스킬 데미지 증가 = (특화 계수 × 특화 수치) % 로 계산됩니다.</small>
                </div>

                <div class="form-group">
                    <label>적용 스킬 태그 (쉼표 구분)</label>
                    <input type="text" id="specTargetTags" placeholder="예: 우산, 급습, 랜스, 둔갑" 
                           onfocus="setActiveInput(this)" 
                           onkeyup="handleTagKeyUp(event, this)" 
                           onblur="registerTagsFromInput(this.value)">
                    <small style="color: #6c6c6c;">※ 해당 태그를 소유한 스킬에 특화 데미지 증가가 적용됩니다.</small>
                    
                    <!-- 📌 태그 추천 뱃지 영역 -->
                    <div style="margin-top: 8px;">
                        <span style="font-size: 11px; font-weight: bold; color: #495057;">⚡ 최근 사용된 태그 (클릭하여 추가):</span>
                        <div class="dynamic-tag-badges" style="display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px;"></div>
                    </div>
                </div>

                <button type="button" class="btn-submit btn-submit-spec" onclick="saveSpecData()">💾 특화 설정 저장</button>
            </form>
        </div>

        <div class="json-section">
            <label style="color: #fff;">📋 현재 설정된 특화 상태</label>
            <div id="specListPreview" class="list-preview"></div>

            <label style="color: #fff;">📁 specializationData JSON 결과물</label>
            <textarea id="jsonSpecOutput" class="json-spec" onchange="syncJsonToData('spec')"></textarea>
            
            <div class="action-grid">
                <button class="btn-action btn-copy" onclick="copyJson('jsonSpecOutput')">📋 JSON 복사</button>
                <button class="btn-action btn-file" onclick="downloadJson(specializationData, 'specializationData.json')">💾 파일 저장</button>
                <button class="btn-action btn-file" onclick="document.getElementById('fileInputSpec').click()">📂 파일 불러오기</button>
                <button class="btn-action btn-copy" onclick="syncJsonToData('spec')">🔄 JSON -> 데이터 동기화</button>
                <button class="btn-action btn-reset" onclick="resetData('spec')">🗑️ 특화 데이터 전체 초기화</button>
            </div>
            <input type="file" id="fileInputSpec" style="display:none;" accept=".json" onchange="uploadJson(event, 'spec')">
        </div>
    </div>
</div>

<script>
    // 카테고리 정의
    const BASE_CATEGORIES = [
        "주스탯", "주스탯 %",
        "무기 공격력", "무기 공격력 %", "기본 공격력", "기본 공격력 %", "공격력", "공격력 %",
        "치명", "특화", "신속", "진화형 피해", "추가 피해",
        "치명타 적중률", "치명타 피해", "치명타 시 적에게 주는 피해",
        "적에게 주는 피해", "방어력 무시",
        "이동 속도", "공격 속도", "쿨타임 감소",
        "마나 스킬 쿨타임 감소", "쿨타임 증가", "고정 쿨타임 감소", "고정 쿨타임 증가"
    ];

    const FIXED_UNITS = ["주스탯", "무기 공격력", "기본 공격력", "공격력", "치명", "특화", "신속"];
    const SECOND_UNITS = ["고정 쿨타임 감소", "고정 쿨타임 증가"];

    function getCategoryLabel(cat) {
        if (FIXED_UNITS.includes(cat)) return `${cat} (고정치)`;
        if (SECOND_UNITS.includes(cat)) return `${cat} (초)`;
        return `${cat} (%)`;
    }

    // 카테고리명을 기반으로 데이터 단위(unit) 결정하는 함수
    function getUnitByCategory(category) {
        if (FIXED_UNITS.includes(category) || SECOND_UNITS.includes(category)) {
            return "";
        }
        return "%";
    }

    // 초기 구조 생성자
    function createEmptyOrderStructure() {
        return {
            "해": { "고대": {}, "유물": {} },
            "달": { "고대": {}, "유물": {} },
            "별": { "고대": {}, "유물": {} }
        };
    }

    // 전역 데이터
    let skillDatabase = [];
    let orderDataSets = createEmptyOrderStructure();
    let buffDatabase = [];
    let specializationData = { coefficient: 0, targetTags: [] };

    let editingSkillIndex = null;
    let editingBuffIndex = null;
    let editingOrderInfo = null;

    // 프로그램 전체에서 사용할 통합 태그 캐시 (Set)
    const globalTagCache = new Set();
    // 현재 포커스되어 있는 태그 입력창 기억 변수
    let activeTagInput = null;

    function setActiveInput(inputElem) {
        activeTagInput = inputElem;
    }

    // 1. 기존 데이터베이스 + 사용중인 태그를 모두 수집하는 함수
    function refreshGlobalTagCache() {
        for (const coreType in orderDataSets) {
            for (const grade in orderDataSets[coreType]) {
                for (const pt in orderDataSets[coreType][grade]) {
                    (orderDataSets[coreType][grade][pt] || []).forEach(node => {
                        (node.effects || []).forEach(eff => {
                            if (eff.requireTags) eff.requireTags.forEach(t => t && globalTagCache.add(t.trim()));
                            if (eff.excludeTags) eff.excludeTags.forEach(t => t && globalTagCache.add(t.trim()));
                        });
                    });
                }
            }
        }

        buffDatabase.forEach(buff => {
            (buff.effects || []).forEach(eff => {
                if (eff.requireTags) eff.requireTags.forEach(t => t && globalTagCache.add(t.trim()));
                if (eff.excludeTags) eff.excludeTags.forEach(t => t && globalTagCache.add(t.trim()));
            });
        });

        if (specializationData && specializationData.targetTags) {
            specializationData.targetTags.forEach(t => t && globalTagCache.add(t.trim()));
        }

        skillDatabase.forEach(skill => {
            if (skill.tags) skill.tags.forEach(t => t && globalTagCache.add(t.trim()));
        });
    }

    // 2. 완성된 태그만 캐시에 등록하는 함수 (한글 조합 버그 해결)
    function registerTagsFromInput(inputValue) {
        if (!inputValue) return;

        // 한글 자음/모음만 외롭게 있는 글자(ㄱ-ㅎ, ㅏ-ㅣ) 제외 정규식
        const jamoRegex = /^[ㄱ-ㅎㅏ-ㅣ]+$/;

        const tags = inputValue.split(',')
            .map(t => t.trim())
            .filter(t => t.length > 0 && !jamoRegex.test(t));

        let isNewAdded = false;

        tags.forEach(tag => {
            if (!globalTagCache.has(tag)) {
                globalTagCache.add(tag);
                isNewAdded = true;
            }
        });

        if (isNewAdded) {
            renderAllTagBadges();
        }
    }

    // 3. 키보드 입력 이벤트 감지 (쉼표나 Enter 입력 시 태그 즉시 반영)
    function handleTagKeyUp(event, inputElem) {
        if (event.key === ',' || event.key === 'Enter') {
            registerTagsFromInput(inputElem.value);
        }
    }

    // 4. 클릭한 태그를 Target Input 요소에 추가하는 함수
    function appendTagToInput(tag, targetInput = null) {
        const input = targetInput || activeTagInput;
        if (!input) return;

        let currentTags = input.value.split(',').map(t => t.trim()).filter(t => t.length > 0);

        if (!currentTags.includes(tag)) {
            currentTags.push(tag);
            input.value = currentTags.join(', ');
            registerTagsFromInput(input.value);
        }
    }

    // 5. 화면 상의 모든 추천 태그 뱃지 영역을 갱신하는 공통 함수
    function renderAllTagBadges() {
        const sortedTags = Array.from(globalTagCache).sort();
        
        document.querySelectorAll(".dynamic-tag-badges").forEach(container => {
            container.innerHTML = "";

            if (sortedTags.length === 0) {
                container.innerHTML = `<span style="font-size: 11px; color: #aaa;">(등록된 조건 태그가 없습니다)</span>`;
                return;
            }

            sortedTags.forEach(tag => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.innerText = `+ ${tag}`;
                btn.style.cssText = `
                    padding: 2px 7px;
                    font-size: 11px;
                    background: #f8f9fa;
                    color: #495057;
                    border: 1px solid #dee2e6;
                    border-radius: 10px;
                    cursor: pointer;
                    transition: all 0.15s ease;
                `;
                
                btn.onmouseover = () => { btn.style.background = '#0d6efd'; btn.style.color = '#fff'; btn.style.borderColor = '#0d6efd'; };
                btn.onmouseout = () => { btn.style.background = '#f8f9fa'; btn.style.color = '#495057'; btn.style.borderColor = '#dee2e6'; };

                btn.onclick = (e) => {
                    e.preventDefault();
                    const parentGroup = container.closest('.card-box, .form-group');
                    let targetInput = null;

                    if (activeTagInput && parentGroup && parentGroup.contains(activeTagInput)) {
                        targetInput = activeTagInput;
                    } else if (parentGroup) {
                        targetInput = parentGroup.querySelector('input[type="text"]');
                    }
                    if (!targetInput) targetInput = activeTagInput;

                    appendTagToInput(tag, targetInput);
                };

                container.appendChild(btn);
            });
        });
    }

    function addSkillToDatabase() {
        const nameInput = document.getElementById("skillName");
        const name = nameInput.value.trim();
        const constant = parseFloat(document.getElementById("constant").value) || 0;
        const coefficient = parseFloat(document.getElementById("coefficient").value) || 0;
        const baseCooldown = parseFloat(document.getElementById("baseCooldown").value) || 0;
        const rawMana = document.getElementById("baseMana").value;
        const mana = rawMana !== "" ? parseFloat(rawMana) : 0;

        let tags = document.getElementById("tags").value.split(",").map(t => t.trim()).filter(t => t.length > 0);

        if (!name) { alert("스킬 이름을 입력해 주세요!"); return; }

        if (tags.length === 0 || tags[0] !== name) {
            tags.unshift(name);
        }

        const cardElements = document.querySelectorAll("#tripodContainer .card-box");
        const tripods = [];

        cardElements.forEach(card => {
            const tier = parseInt(card.querySelector(".tp-tier").value);
            const tpName = card.querySelector(".tp-name").value.trim();
            const effects = [];

            card.querySelectorAll(".sub-effect-row").forEach(row => {
                const category = row.querySelector(".sub-cat").value;
                const val = parseFloat(row.querySelector(".sub-val").value) || 0;
                const unit = getUnitByCategory(category);
                effects.push({ category, val, unit });
            });

            if (tpName && effects.length > 0) tripods.push({ tier, name: tpName, effects });
        });

        const skillData = { name, constant, coefficient, baseCooldown, mana, tags, tripods };

        if (editingSkillIndex !== null) {
            skillDatabase[editingSkillIndex] = skillData;
            editingSkillIndex = null;
            document.getElementById("btnSkillSubmit").innerText = "+ 스킬 목록에 추가";
            document.getElementById("btnSkillCancel").style.display = "none";
        } else {
            skillDatabase.push(skillData);
        }

        updateSkillUI();
        resetSkillForm();
    }

    function sanitizeOrderDataStructure(data) {

        let target = data || {};
        types.forEach(t => {
            if (!target[t]) target[t] = {};
            grades.forEach(g => {
                if (!target[t][g]) target[t][g] = {};
            });
        });
        return target;
    }

    function addOrderNode() {
        const coreType = document.getElementById("coreType").value;
        const groupId = document.getElementById("groupId").value.trim();
        const nodePointVal = document.getElementById("nodePoint").value;
        const is17pt = nodePointVal === "17";

        orderDataSets = sanitizeOrderDataStructure(orderDataSets);

        const nodeGroupId = editingOrderInfo ? editingOrderInfo.id : ('node_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4));

        if (editingOrderInfo) {
            deleteOrderNodeById(editingOrderInfo.id, false);
            editingOrderInfo = null;
        }

        if (is17pt) {
            const ancientEffects = [];
            const relicEffects = [];

            document.querySelectorAll("#orderEffectsContainer .order-card").forEach(box => {
                const category = box.querySelector(".ord-cat").value;
                const valAncient = parseFloat(box.querySelector(".ord-val-ancient").value) || 0;
                const valRelic = parseFloat(box.querySelector(".ord-val-relic").value) || 0;
                const requireTags = box.querySelector(".ord-tags").value.split(",").map(s => s.trim()).filter(s => s.length > 0);
                const excludeTags = box.querySelector(".ord-exclude-tags").value.split(",").map(s => s.trim()).filter(s => s.length > 0);

                const unit = getUnitByCategory(category);

                const effAncientObj = { category, val: valAncient, unit };
                const effRelicObj = { category, val: valRelic, unit };

                if (requireTags.length > 0) { effAncientObj.requireTags = requireTags; effRelicObj.requireTags = requireTags; }
                if (excludeTags.length > 0) { effAncientObj.excludeTags = excludeTags; effRelicObj.excludeTags = excludeTags; }

                ancientEffects.push(effAncientObj);
                relicEffects.push(effRelicObj);
            });

            if (ancientEffects.length === 0) { alert("효과를 입력해 주세요!"); return; }

            if (!orderDataSets[coreType]["고대"][17]) orderDataSets[coreType]["고대"][17] = [];
            if (!orderDataSets[coreType]["유물"][17]) orderDataSets[coreType]["유물"][17] = [];

            const ancientObj = { id: nodeGroupId, effects: ancientEffects };
            const relicObj = { id: nodeGroupId, effects: relicEffects };
            if (groupId) { ancientObj.groupId = groupId; relicObj.groupId = groupId; }

            orderDataSets[coreType]["고대"][17].push(ancientObj);
            orderDataSets[coreType]["유물"][17].push(relicObj);

        } else {
            const effects = [];
            document.querySelectorAll("#orderEffectsContainer .order-card").forEach(box => {
                const category = box.querySelector(".ord-cat").value;
                const val = parseFloat(box.querySelector(".ord-val").value) || 0;
                const requireTags = box.querySelector(".ord-tags").value.split(",").map(s => s.trim()).filter(s => s.length > 0);
                const excludeTags = box.querySelector(".ord-exclude-tags").value.split(",").map(s => s.trim()).filter(s => s.length > 0);
                
                const unit = getUnitByCategory(category);
                const effObj = { category, val, unit };
                if (requireTags.length > 0) effObj.requireTags = requireTags;
                if (excludeTags.length > 0) effObj.excludeTags = excludeTags;
                effects.push(effObj);
            });

            if (effects.length === 0) { alert("효과를 입력해 주세요!"); return; }

            const pointsToApply = (nodePointVal === "18-20") ? [18, 19, 20] : [parseInt(nodePointVal)];

            ["고대", "유물"].forEach(grade => {
                pointsToApply.forEach(pt => {
                    if (!orderDataSets[coreType][grade][pt]) {
                        orderDataSets[coreType][grade][pt] = [];
                    }
                    const clonedEffects = JSON.parse(JSON.stringify(effects));
                    
                    const nodeObj = { id: nodeGroupId, effects: clonedEffects };
                    if (groupId) nodeObj.groupId = groupId;

                    orderDataSets[coreType][grade][pt].push(nodeObj);
                });
            });
        }

        const submitBtn = document.getElementById("btnOrderSubmit");
        if (submitBtn) {
            submitBtn.innerText = "+ 질서 코어 노드 추가";
            submitBtn.style.background = "#fd7e14";
            submitBtn.style.color = "white";
        }
        document.getElementById("btnOrderCancel").style.display = "none";

        updateOrderUI();
        document.getElementById("orderEffectsContainer").innerHTML = "";
        addOrderEffectRow();
    }

    function editOrderNodeById(targetId) {
        let foundType = null, foundPoint = null, ancientNode = null, relicNode = null;

        for (const coreType in orderDataSets) {
            for (const grade in orderDataSets[coreType]) {
                for (const pt in orderDataSets[coreType][grade]) {
                    const list = orderDataSets[coreType][grade][pt];
                    if (Array.isArray(list)) {
                        const item = list.find(node => node && node.id === targetId);
                        if (item) {
                            foundType = coreType;
                            foundPoint = String(pt);
                            if (grade === "고대") ancientNode = item;
                            if (grade === "유물") relicNode = item;
                        }
                    }
                }
            }
            if (ancientNode || relicNode) break;
        }

        if (!ancientNode && !relicNode) {
            alert("수정할 노드 데이터를 찾지 못했습니다.");
            return;
        }

        if (!ancientNode) ancientNode = relicNode;
        if (!relicNode) relicNode = ancientNode;

        editingOrderInfo = { id: targetId };

        document.getElementById("coreType").value = foundType;
        document.getElementById("groupId").value = ancientNode.groupId || "";
        
        const is18to20 = ["18", "19", "20"].includes(foundPoint);
        const ptSelect = document.getElementById("nodePoint");
        ptSelect.value = is18to20 ? "18-20" : foundPoint;

        const container = document.getElementById("orderEffectsContainer");
        container.innerHTML = "";

        const is17pt = foundPoint === "17";

        if (is17pt) {
            const ancEffs = ancientNode.effects || [];
            const relEffs = relicNode.effects || [];
            const maxLen = Math.max(ancEffs.length, relEffs.length);

            for (let i = 0; i < maxLen; i++) {
                const anc = ancEffs[i] || {};
                const rel = relEffs[i] || {};
                const cat = anc.category || rel.category || "적에게 주는 피해";
                const reqTags = (anc.requireTags || rel.requireTags || []).join(", ");
                const excTags = (anc.excludeTags || rel.excludeTags || []).join(", ");

                addOrderEffectRow(cat, anc.val ?? "", rel.val ?? "", reqTags, excTags);
            }
        } else {
            (ancientNode.effects || []).forEach(eff => {
                const reqTags = (eff.requireTags || []).join(", ");
                const excTags = (eff.excludeTags || []).join(", ");
                addOrderEffectRow(eff.category, eff.val ?? "", "", reqTags, excTags);
            });
        }

        const submitBtn = document.getElementById("btnOrderSubmit");
        if (submitBtn) {
            submitBtn.innerText = "✏️ 질서 코어 노드 수정 완료 (고대/유물 세트)";
            submitBtn.style.background = "#ffc107";
            submitBtn.style.color = "#212529";
        }
        document.getElementById("btnOrderCancel").style.display = "block";

        document.getElementById("orderForm").scrollIntoView({ behavior: 'smooth' });
    }

    function deleteOrderNodeById(targetId, needUpdateUI = true) {
        if (!targetId) return;
        
        if (needUpdateUI && !confirm("이 코어 노드를 삭제하시겠습니까?")) return;

        let found = false;
        for (const coreType in orderDataSets) {
            for (const grade in orderDataSets[coreType]) {
                for (const pt in orderDataSets[coreType][grade]) {
                    const list = orderDataSets[coreType][grade][pt];
                    if (Array.isArray(list)) {
                        const initialLen = list.length;
                        orderDataSets[coreType][grade][pt] = list.filter(node => node && node.id !== targetId);
                        if (orderDataSets[coreType][grade][pt].length < initialLen) {
                            found = true;
                        }
                    }
                }
            }
        }

        if (needUpdateUI) {
            if (found) {
                updateOrderUI();
            } else {
                alert("삭제할 노드를 찾지 못했습니다.");
            }
        }
    }

    function updateOrderUI() {
        orderDataSets = sanitizeOrderDataStructure(orderDataSets);
        document.getElementById("jsonOrderOutput").value = JSON.stringify(orderDataSets, null, 4);
        
        const listContainer = document.getElementById("orderListPreview");
        listContainer.innerHTML = "";

        let hasData = false;
        const processedIds = new Set();

        for (const coreType in orderDataSets) {
            for (const grade in orderDataSets[coreType]) {
                const sortedPoints = Object.keys(orderDataSets[coreType][grade] || {}).sort((a,b) => Number(a) - Number(b));

                sortedPoints.forEach(nodePoint => {
                    const nodeList = orderDataSets[coreType][grade][nodePoint];
                    if (Array.isArray(nodeList)) {
                        nodeList.forEach((node) => {
                            if (!node) return;
                            
                            if (!node.id) {
                                node.id = 'node_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
                            }

                            const nodeId = node.id;
                            if (processedIds.has(nodeId)) return;
                            processedIds.add(nodeId);

                            hasData = true;
                            const effCount = node.effects ? node.effects.length : 0;
                            const gIdStr = node.groupId ? ` | Group: <span style="color:#20c997;">${node.groupId}</span>` : '';
                            
                            const div = document.createElement("div");
                            div.className = "list-item";
                            
                            div.innerHTML = `
                                <span><strong>[${coreType}] ${nodePoint}pt</strong>${gIdStr} (${effCount}개 효과) <small style="color:#aaa;">[고대/유물 연동]</small></span>
                                <div>
                                    <button class="btn-edit" onclick="editOrderNodeById('${nodeId}')">수정</button>
                                    <button class="btn-del" onclick="deleteOrderNodeById('${nodeId}', true)">삭제</button>
                                </div>
                            `;
                            listContainer.appendChild(div);
                        });
                    }
                });
            }
        }

        if (!hasData) {
            listContainer.innerHTML = `<span style="color:#888; font-size:12px;">등록된 질서 코어 노드가 없습니다.</span>`;
        }
        refreshGlobalTagCache();
        renderAllTagBadges();
    }

    // --- TAB 3: 고유 버프 / 스탯 ---
    function toggleBuffInputType(selectEl) {
        const rowBox = selectEl.closest('.buff-card');
        const fixedContainer = rowBox.querySelector('.val-fixed-container');
        const formulaContainer = rowBox.querySelector('.val-formula-container');

        if (selectEl.value === 'formula') {
            fixedContainer.style.display = 'none';
            formulaContainer.style.display = 'block';
        } else {
            fixedContainer.style.display = 'block';
            formulaContainer.style.display = 'none';
        }
    }

    function insertVariable(btn, varName) {
        const container = btn.closest('.val-formula-container');
        const input = container.querySelector('.buff-formula');
        if (input) {
            input.value += varName;
            input.focus();
        }
    }

    function addBuffEffectRow(category = "적에게 주는 피해", val = "", formula = "", tags = "", excludeTags = "") {
        const container = document.getElementById("buffEffectsContainer");
        const rowDiv = document.createElement("div");
        rowDiv.className = "card-box buff-card";

        const isFormulaMode = Boolean(formula);
        const rowId = "buff_" + Date.now() + "_" + Math.floor(Math.random() * 1000);

        rowDiv.innerHTML = `
            <div style="display: flex; gap: 8px; margin-bottom: 6px;">
                <select class="buff-cat" style="flex: 2;">${getCategoryOptionsHtml(category)}</select>
                <select class="buff-val-type" style="width: 110px; font-weight: bold; background: #eef2ff;" onchange="toggleBuffInputType(this)">
                    <option value="fixed" ${!isFormulaMode ? 'selected' : ''}>고정 수치</option>
                    <option value="formula" ${isFormulaMode ? 'selected' : ''}>🧮 수식 입력</option>
                </select>
                <button type="button" class="btn-del" onclick="this.parentElement.parentElement.remove()">삭제</button>
            </div>

            <div class="val-fixed-container" style="display: ${isFormulaMode ? 'none' : 'block'}; margin-bottom: 6px;">
                <input type="number" step="any" class="buff-val" value="${val}" placeholder="수치 (예: 10 또는 1500)">
            </div>

            <div class="val-formula-container" style="display: ${isFormulaMode ? 'block' : 'none'}; margin-bottom: 6px; background: #f8fafc; padding: 10px; border-radius: 6px; border: 1px dashed #6366f1;">
                <input type="text" class="buff-formula" value="${formula}" placeholder="예: Math.min(finalMoveSpeed, 40) * 0.36" style="margin-bottom: 8px; font-family: monospace; font-weight: bold; border: 1px solid #6366f1;">
                
                <div style="font-size: 11px; color: #475569; background: #fff; padding: 8px; border-radius: 4px; border: 1px solid #e2e8f0; line-height: 1.45;">
                    <div style="font-weight: bold; color: #4f46e5; margin-bottom: 4px;">ℹ️ 수식 입력 가이드 (특별한 계산이 필요한 경우)</div>
                    <div style="background: #f1f5f9; padding: 6px; border-radius: 4px; margin-bottom: 6px;">
                        <strong>📌 기본 사용 가능 변수:</strong><br>
                        • <code>totalCritStat</code> : 치명<br>
                        • <code>totalSwiftStat</code> : 신속<br>
                        • <code>totalSpecStat</code> : 특화<br>
                        • <code>critRate</code> : 치명타 적중률 (%)<br>
                        • <code>finalAtkSpeed</code> : 공격 속도 증가량 (%)<br>
                        • <code>finalMoveSpeed</code> : 이동 속도 증가량 (%)
                    </div>
                </div>

                <div style="display: flex; gap: 4px; align-items: center; flex-wrap: wrap; margin-top: 8px;">
                    <span style="font-size: 11px; font-weight: bold; color: #475569;">⚡ 변수 클릭 입력:</span>
                    <button type="button" class="btn-sub-add" style="margin:0; padding:2px 6px; font-size:11px; background:#4f46e5;" onclick="insertVariable(this, 'totalCritStat')">+ totalCritStat</button>
                    <button type="button" class="btn-sub-add" style="margin:0; padding:2px 6px; font-size:11px; background:#4f46e5;" onclick="insertVariable(this, 'totalSwiftStat')">+ totalSwiftStat</button>
                    <button type="button" class="btn-sub-add" style="margin:0; padding:2px 6px; font-size:11px; background:#4f46e5;" onclick="insertVariable(this, 'totalSpecStat')">+ totalSpecStat</button>
                    <button type="button" class="btn-sub-add" style="margin:0; padding:2px 6px; font-size:11px; background:#4f46e5;" onclick="insertVariable(this, 'critRate')">+ critRate</button>
                    <button type="button" class="btn-sub-add" style="margin:0; padding:2px 6px; font-size:11px; background:#4f46e5;" onclick="insertVariable(this, 'finalAtkSpeed')">+ finalAtkSpeed</button>
                    <button type="button" class="btn-sub-add" style="margin:0; padding:2px 6px; font-size:11px; background:#4f46e5;" onclick="insertVariable(this, 'finalMoveSpeed')">+ finalMoveSpeed</button>
                </div>
            </div>

            <!-- ⚡ 태그 입력란 및 추천 뱃지 영역 -->
            <div style="display: flex; gap: 8px;">
                <input type="text" class="buff-tags" value="${tags}" placeholder="적용 스킬 태그 (비워두면 전체 적용)" style="flex: 1;" 
                       onfocus="setActiveInput(this)" onkeyup="handleTagKeyUp(event, this)" onblur="registerTagsFromInput(this.value)">
                <input type="text" class="buff-exclude-tags" value="${excludeTags}" placeholder="제외 스킬 태그 (예: 기상)" style="flex: 1; border: 1px solid #dc3545;" 
                       onfocus="setActiveInput(this)" onkeyup="handleTagKeyUp(event, this)" onblur="registerTagsFromInput(this.value)">
            </div>

            <!-- 📌 동적 추천 태그 뱃지 컨테이너 -->
            <div id="badges_${rowId}" class="dynamic-tag-badges" style="display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px;"></div>
        `;

        container.appendChild(rowDiv);
        renderAllTagBadges();
    }

    function addBuffToDatabase() {
        const name = document.getElementById("buffName").value.trim();
        if (!name) { alert("버프 / 스탯 이름을 입력해 주세요!"); return; }

        const cards = document.querySelectorAll("#buffEffectsContainer .buff-card");
        const effects = [];

        cards.forEach(card => {
            const category = card.querySelector(".buff-cat").value;
            const type = card.querySelector(".buff-val-type").value;
            const val = parseFloat(card.querySelector(".buff-val")?.value) || 0;
            const formula = card.querySelector(".buff-formula")?.value.trim() || "";
            const requireTags = card.querySelector(".buff-tags")?.value.split(",").map(s => s.trim()).filter(s => s.length > 0) || [];
            const excludeTags = card.querySelector(".buff-exclude-tags")?.value.split(",").map(s => s.trim()).filter(s => s.length > 0) || [];

            const unit = getUnitByCategory(category);
            const effObj = { category };
            
            if (type === 'formula') {
                effObj.formula = formula;
            } else {
                effObj.val = val;
            }
            
            effObj.unit = unit;

            if (requireTags.length > 0) effObj.requireTags = requireTags;
            if (excludeTags.length > 0) effObj.excludeTags = excludeTags;

            effects.push(effObj);
        });

        if (effects.length === 0) { alert("최소 1개 이상의 효과를 추가해 주세요!"); return; }

        const buffData = { name, effects };

        if (editingBuffIndex !== null) {
            buffDatabase[editingBuffIndex] = buffData;
            editingBuffIndex = null;
            const btn = document.getElementById("btnBuffSubmit");
            if (btn) {
                btn.innerText = "+ 버프 / 스탯 목록에 추가";
                btn.style.background = "#6f42c1";
            }
            document.getElementById("btnBuffCancel").style.display = "none";
        } else {
            buffDatabase.push(buffData);
        }

        updateBuffUI();
        resetBuffForm();
    }

    function updateBuffUI() {
        document.getElementById("jsonBuffOutput").value = JSON.stringify(buffDatabase, null, 4);
        const listContainer = document.getElementById("buffListPreview");
        listContainer.innerHTML = "";
        buffDatabase.forEach((bf, idx) => {
            listContainer.innerHTML += `
                <div class="list-item">
                    <span><strong>${bf.name}</strong> (${bf.effects ? bf.effects.length : 0}개 효과)</span>
                    <div>
                        <button class="btn-edit" onclick="editBuff(${idx})">수정</button>
                        <button class="btn-del" onclick="deleteBuff(${idx})">삭제</button>
                    </div>
                </div>`;
        });
        refreshGlobalTagCache();
        renderAllTagBadges();
    }

    function editBuff(index) {
        const bf = buffDatabase[index];
        if (!bf) return;

        editingBuffIndex = index;
        document.getElementById("buffName").value = bf.name || "";

        const container = document.getElementById("buffEffectsContainer");
        container.innerHTML = "";

        (bf.effects || []).forEach(eff => {
            const reqTags = (eff.requireTags || []).join(", ");
            const excTags = (eff.excludeTags || []).join(", ");
            addBuffEffectRow(eff.category, eff.val ?? "", eff.formula ?? "", reqTags, excTags);
        });

        const btn = document.getElementById("btnBuffSubmit");
        if (btn) {
            btn.innerText = "✏️ 버프 / 스탯 수정 완료";
            btn.style.background = "#ffc107";
        }
        document.getElementById("btnBuffCancel").style.display = "block";

        document.getElementById("buffForm").scrollIntoView({ behavior: 'smooth' });
    }

    function cancelBuffEdit() {
        editingBuffIndex = null;
        const btn = document.getElementById("btnBuffSubmit");
        if (btn) {
            btn.innerText = "+ 버프 / 스탯 목록에 추가";
            btn.style.background = "#6f42c1";
        }
        document.getElementById("btnBuffCancel").style.display = "none";
        resetBuffForm();
    }

    function deleteBuff(index) {
        if (confirm("삭제하시겠습니까?")) { buffDatabase.splice(index, 1); updateBuffUI(); }
    }

    function resetBuffForm() {
        document.getElementById("buffName").value = "";
        document.getElementById("buffEffectsContainer").innerHTML = "";
        addBuffEffectRow();
    }

    // --- TAB 4: 직업 특화 설정 ---
    function saveSpecData() {
        const coefficient = parseFloat(document.getElementById("specCoefficient").value) || 0;
        const targetTags = document.getElementById("specTargetTags").value.split(",").map(t => t.trim()).filter(t => t.length > 0);

        specializationData = { coefficient, targetTags };
        updateSpecUI();
        alert("특화 설정이 저장되었습니다!");
    }

    function updateSpecUI() {
        document.getElementById("jsonSpecOutput").value = JSON.stringify(specializationData, null, 4);
        document.getElementById("specCoefficient").value = specializationData.coefficient || "";
        document.getElementById("specTargetTags").value = specializationData.targetTags ? specializationData.targetTags.join(", ") : "";

        const listContainer = document.getElementById("specListPreview");
        const tagsStr = specializationData.targetTags && specializationData.targetTags.length > 0 ? specializationData.targetTags.join(", ") : "없음";
        
        listContainer.innerHTML = `
            <div class="list-item">
                <span><strong>계수:</strong> ${specializationData.coefficient} | <strong>적용 태그:</strong> [${tagsStr}]</span>
            </div>
        `;
        refreshGlobalTagCache();
        renderAllTagBadges();
    }

    // --- Utility ---
    function copyJson(elementId) {
        const textarea = document.getElementById(elementId);
        if(!textarea.value) { alert("데이터가 없습니다!"); return; }
        textarea.select();
        document.execCommand("copy");
        alert("클립보드에 복사되었습니다!");
    }

    function downloadJson(data, filename) {
        const blob = new Blob([JSON.stringify(data, null, 4)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
    }

    function uploadJson(event, type) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const parsed = JSON.parse(e.target.result);
                if (type === 'skill') { skillDatabase = parsed; updateSkillUI(); }
                else if (type === 'order') { orderDataSets = sanitizeOrderDataStructure(parsed); updateOrderUI(); }
                else if (type === 'buff') { buffDatabase = parsed; updateBuffUI(); }
                else if (type === 'spec') { specializationData = parsed; updateSpecUI(); }
                alert("성공적으로 불러왔습니다!");
            } catch (err) {
                alert("JSON 형식이 올바르지 않습니다.");
            }
        };
        reader.readAsText(file);
    }

    function syncJsonToData(type) {
        try {
            if (type === 'skill') {
                skillDatabase = JSON.parse(document.getElementById("jsonSkillOutput").value);
                updateSkillUI();
            } else if (type === 'order') {
                const parsed = JSON.parse(document.getElementById("jsonOrderOutput").value);
                orderDataSets = sanitizeOrderDataStructure(parsed);
                updateOrderUI();
            } else if (type === 'buff') {
                buffDatabase = JSON.parse(document.getElementById("jsonBuffOutput").value);
                updateBuffUI();
            } else if (type === 'spec') {
                specializationData = JSON.parse(document.getElementById("jsonSpecOutput").value);
                updateSpecUI();
            }
            alert("JSON 동기화 완료!");
        } catch (e) {
            alert("JSON 구문 오류가 있습니다.");
        }
    }

    function resetData(type) {
        if (confirm("정말로 모든 데이터를 삭제하시겠습니까?")) {
            if (type === 'skill') { skillDatabase = []; updateSkillUI(); resetSkillForm(); }
            else if (type === 'order') { orderDataSets = createEmptyOrderStructure(); updateOrderUI(); }
            else if (type === 'buff') { buffDatabase = []; updateBuffUI(); resetBuffForm(); }
            else if (type === 'spec') { specializationData = { coefficient: 0, targetTags: [] }; updateSpecUI(); }
        }
    }

    // 페이지 로드 시 초기 화면 렌더링
    addTripodCard();
    addOrderEffectRow();
    addBuffEffectRow();
    updateSkillUI();
    updateOrderUI();
    updateBuffUI();
    updateSpecUI();
</script>

</body>
</html>
